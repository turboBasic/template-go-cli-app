name: Bug report
description: Something behaves differently than documented
title: "fix: "
body:
  - type: checkboxes
    attributes:
      label: Before filing
      options:
        - label: I searched existing issues for a duplicate.
          required: true
      description: >-
        Search for a duplicate in the
        [open and closed issues](https://github.com/turboBasic/template-go-cli-app/issues?q=is%3Aissue).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect instead?
      description: Include the command you ran and relevant output. Remove secrets before posting.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal sequence of commands or configuration that reproduces the problem.
      render: shell
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Go version, operating system, and architecture.
    validations:
      required: false
