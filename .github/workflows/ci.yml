name: 🌜 ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  platforms:
    name: ${{ matrix.goos }} / ${{ matrix.goarch }}
    uses: turboBasic/github-actions/.github/workflows/project-ci.yml@v0.4
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-26.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
    permissions:
      contents: read
    with:
      runner-type: ${{ matrix.runner }}
      run-lint: ${{ matrix.goos == 'linux' && matrix.goarch == 'amd64' }}
      run-coverage: ${{ matrix.goos == 'linux' && matrix.goarch == 'amd64' }}
      run-typecheck: false

  checks:
    name: checks
    if: always()
    needs: [platforms]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Require all platform checks to pass
        env:
          PLATFORMS_RESULT: ${{ needs.platforms.result }}
        run: test "$PLATFORMS_RESULT" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          minimum_release_age: 24h

      # mise-action caches the tool installs only; module downloads and compiled packages live outside it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-

      - name: Test with race detector
        run: mise run test-race
