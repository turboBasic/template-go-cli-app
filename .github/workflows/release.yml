name: 🚀 release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

jobs:
  release:
    name: release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
          minimum_release_age: 24h

      - name: Test the tagged commit
        run: mise run test

      - name: Publish the GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec -- goreleaser release --clean

      # Private repositories on free plans cannot attest provenance.
      - name: Attest build provenance
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Verify the signed checksums
        run: |
          mise exec -- cosign verify-blob \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/checksums.txt
