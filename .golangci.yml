version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        presentation:
          # Terminal presentation stays behind internal/cli so main and the core keep owning
          # signals, exit codes and results.
          list-mode: lax
          files:
            - "!**/internal/cli/**"
          deny:
            - pkg: charm.land/fang/v2
              desc: import Fang only from internal/cli
            - pkg: github.com/charmbracelet/colorprofile
              desc: import colorprofile only from internal/cli
        styling:
          # Styling and animation stay in the renderer so domain and application code never see a
          # rendering library.
          list-mode: lax
          files:
            - "!**/internal/output/**"
          deny:
            - pkg: charm.land/lipgloss/v2
              desc: import Lip Gloss only from internal/output
            - pkg: charm.land/bubbletea/v2
              desc: import Bubble Tea only from internal/output
            - pkg: charm.land/bubbles/v2
              desc: import Bubbles only from internal/output
