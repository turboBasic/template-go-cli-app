version: 2

project_name: cli-app

builds:
  - id: cli-app
    binary: cli-app
    main: ./cmd/cli-app
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.buildDate={{ .Date }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

sboms:
  - id: archive
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"
    cmd: syft
    args: ["$artifact", "--output", "spdx-json=$document"]

signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]

homebrew_casks:
  - repository:
      owner: '{{ index .Env "GITHUB_REPOSITORY_OWNER" }}'
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_TOKEN" }}'
    homepage: 'https://github.com/{{ index .Env "GITHUB_REPOSITORY" }}'
    description: '{{ .ProjectName }} command-line tool'
    caveats: |
      {{ .ProjectName }} is not signed or notarized by Apple. If macOS blocks it, run:
        xattr -d com.apple.quarantine "$(which {{ .ProjectName }})"
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'

release:
  prerelease: auto

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^chore'
      - '^docs'
      - '^test'
      - '^ci'
