[settings]
lockfile = true

[shell_alias]
cz = "command cz"

[tools]
"aqua:zizmorcore/zizmor" = "1.31.1"
go = "1.27.3"
golangci-lint = "2.15.0"
jactionlint = { version = "2.4.0", workflow = "release.yaml" }
just = "1.59.0"
"npm:cspell-cli" = "10.4.0"
"npm:markdownlint-cli2" = "0.24.0"
"pipx:commitizen" = { version = "4.19.3", python = "3.14" }
"pipx:yamllint" = { version = "1.38.0", python = "3.14" }
prek = "0.5.9"
shellcheck = "0.11.0"
taplo = "0.10.0"
uv = "0.13.6"

[tasks.lint]
run = "just lint"

[tasks.test]
run = "just test"

[tasks.build]
run = "just build"

[tasks.init]
description = "Initialize a generated project"
usage = '''
arg "[project_name]" help="Project display name"
arg "[module_path]" help="Go module path"
arg "[config_id]" help="Configuration and command identifier"
'''
run = '''
#!/usr/bin/env bash
args=()
if [[ -n "${usage_project_name:-}" || -n "${usage_module_path:-}" || -n "${usage_config_id:-}" ]]; then
  args=("${usage_project_name:-}" "${usage_module_path:-}" "${usage_config_id:-}")
fi
exec ./scripts/init.sh "${args[@]}"
'''
