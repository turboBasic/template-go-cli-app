# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "commit-msg"]
exclude = '(^|/)(\.mise/locks/)'

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-added-large-files"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "commitizen"
name = "commitizen"
entry = "cz check --allow-abort --commit-msg-file"
language = "system"
stages = ["commit-msg"]

[[repos.hooks]]
id = "taplo-lint"
name = "taplo lint"
entry = "taplo lint"
language = "system"
types = ["toml"]

[[repos.hooks]]
id = "taplo-format"
name = "taplo format"
entry = "taplo fmt --check"
language = "system"
types = ["toml"]

[[repos.hooks]]
id = "yamllint"
name = "yamllint"
entry = "yamllint"
language = "system"
types = ["yaml"]

[[repos.hooks]]
id = "cspell"
name = "cspell"
entry = "cspell-cli"
language = "system"
types = ["text"]
stages = ["pre-commit"]
args = [
  "--config",
  ".cspell.config.yaml",
  "--no-progress",
  "--no-must-find-files",
  "--exclude",
  ".mise/locks/**",
  "--gitignore",
  ".",
]

[[repos.hooks]]
id = "markdownlint"
name = "markdownlint"
entry = "markdownlint-cli2"
language = "system"
types = ["markdown"]

[[repos.hooks]]
id = "jactionlint"
name = "jactionlint"
entry = "jactionlint"
language = "system"
files = '^\.github/(workflows/.*\.ya?ml|dependabot\.ya?ml)$'

[[repos.hooks]]
id = "zizmor"
name = "zizmor"
entry = "zizmor --offline --config .github/zizmor.yml"
language = "system"
files = '^\.github/workflows/.*\.ya?ml$'

[[repos.hooks]]
id = "shellcheck"
name = "shellcheck"
entry = "shellcheck"
language = "system"
files = '\.sh$'
types = ["file"]

[[repos.hooks]]
id = "gofmt"
name = "gofmt"
entry = "gofmt -w"
language = "system"
files = '\.go$'
types = ["file"]

[[repos.hooks]]
id = "goimports"
name = "goimports"
entry = "go tool goimports -w"
language = "system"
files = '\.go$'
types = ["file"]

[[repos.hooks]]
id = "go-vet"
name = "go vet"
entry = "go vet ./..."
language = "system"
files = '\.go$'
pass_filenames = false

[[repos.hooks]]
id = "golangci-lint"
name = "golangci-lint"
entry = "golangci-lint run"
language = "system"
files = '\.go$'
pass_filenames = false

[[repos.hooks]]
id = "go-mod-tidy"
name = "go mod tidy -diff"
entry = "go mod tidy -diff"
language = "system"
files = '^(go\.mod|go\.sum|.*\.go)$'
pass_filenames = false
